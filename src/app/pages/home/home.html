<div class="dashboard-container">
    <header class="hero">
        <div class="hero-content">
            <div class="angular-logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250">
                    <path fill="#DD0031" d="M125 30L31.9 63.2l14.2 123.1L125 230l78.9-43.7 14.2-123.1z" />
                    <path fill="#C3002F" d="M125 30v22.2-.1V230l78.9-43.7 14.2-123.1L125 30z" />
                    <path fill="#FFFF"
                        d="M125 52.1L66.8 182.6h21.7l11.7-29.2h49.4l11.7 29.2H183L125 52.1zm17 83.3h-34l17-40.9 17 40.9z" />
                </svg>
            </div>
            <h1 class="hero-title">Angular 21 <span class="highlight">Playground</span></h1>
            <p class="hero-subtitle">Módulos exploratorios: Hooks, Signals, Control Flow y más.</p>
        </div>
    </header>

    <main class="grid-container">
        @for(route of pagesRoutes; track route.path) {
        @if (route.path) {
        <a [routerLink]="route.path" class="route-card">
            <div class="card-content">
                <div class="card-icon">⚡</div>
                <h2 class="card-title">{{ formatRouteName(route.path) }}</h2>
                <p class="card-path">/{{ route.path }}</p>
            </div>
            <div class="card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
        </a>
        }
        }
    </main>
</div>
