<div class="signals-container">
    <div class="glass-card">
        <h1 class="page-title">
            <span class="gradient-text">Signals</span> Works!
        </h1>

        <div class="content-section">
            <div class="data-box">
                <span class="label">Estado de la Señal:</span>
                <div class="value">{{ signalExampleVar() }}</div>
            </div>

            <div class="data-box">
                <span class="label">Datos del Usuario (JSON):</span>
                <pre class="code-block">{{ person() | json }}</pre>
            </div>

            <button class="modern-btn" (click)="increaseAge()">
                Aumentar Edad
            </button>
        </div>
    </div>
</div>
