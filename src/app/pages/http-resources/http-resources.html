<div class="page bg-8">
    <div class="glass-container">
        <h1 class="page-title">
            <span class="gradient-text">HTTP Resource</span> Works!
        </h1>

        <div class="content-section">
            <p class="description">
                Demostración del nuevo <code class="code-badge">httpResource()</code> consumiendo la API de <strong>Rick
                    & Morty</strong>.
            </p>

            <div class="search-container">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" [formControl]="nameFormControl" class="modern-input"
                        placeholder="Buscar personaje por nombre...">
                </div>
            </div>

            <div class="characters-grid">
                @for(item of characters(); track item.id){
                <div class="character-card">
                    <div class="img-wrapper">
                        <img [src]="item.image" alt="Profile of {{ item.name }}" loading="lazy">
                        <span class="status-badge" [class.alive]="item.status === 'Alive'"
                            [class.dead]="item.status === 'Dead'">
                            {{ item.status }}
                        </span>
                    </div>
                    <div class="character-info">
                        <h3 class="name">{{ item.name }}</h3>
                        <p class="species">{{ item.species }} <span>•</span> {{ item.gender }}</p>
                    </div>
                </div>
                }@empty{
                <div class="empty-state">
                    <span class="empty-icon">🛸</span>
                    <p>No se encontraron personajes que coincidan con la búsqueda.</p>
                </div>
                }
            </div>
        </div>
    </div>
</div>
