<h2>Control Value Accessor Parent</h2>
<div style="padding: 20px; border: 1px solid #ccc;">
    <h3>Child Component:</h3>
    <app-child-input [formControl]="control"></app-child-input>
</div>

<div style="margin-top: 20px;">
    <h3>Value in Parent:</h3>
    <pre>{{ control.value | json }}</pre>
    <button (click)="control.disable()">Disable</button>
    <button (click)="control.enable()">Enable</button>
</div>
