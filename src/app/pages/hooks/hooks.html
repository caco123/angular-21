<div class="page bg-1">
    <div class="glass-card">
        <h1 class="page-title">
            <span class="gradient-text">Hooks</span> Works!
        </h1>

        <div class="input-group">
            <label for="nameInput" class="input-label">Ingresa un nombre</label>
            <input id="nameInput" type="text" [(ngModel)]="name" class="modern-input" placeholder="Ej: John Doe">
        </div>

        <!-- El componente hijo recibe los cambios -->
        <app-ngChanges #child [name]="name"></app-ngChanges>
    </div>
</div>
